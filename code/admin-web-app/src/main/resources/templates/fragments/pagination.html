<div th:fragment="pagination" xmlns:th="http://www.thymeleaf.org">
    <template x-if="products.totalPages > 1">
        <nav aria-label="Page navigation">
            <ul class="pagination pagination justify-content-center">
                <li class="page-item" :class="{ 'disabled': products.isFirst }">
                    <a class="page-link" href="/admin/products?page=1">Đầu</a>
                </li>
                <li class="page-item" :class="{ 'disabled': !products.hasPrevious }">
                    <a class="page-link" href="#" :href="'/admin/products?page=' + (products.pageNumber-1)">Trước</a>
                </li>
                <li class="page-item" :class="{ 'disabled': !products.hasNext }">
                    <a class="page-link" href="#" :href="'/admin/products?page=' + (products.pageNumber+1)">Sau</a>
                </li>
                <li class="page-item" :class="{ 'disabled': products.isLast }">
                    <a class="page-link" href="#" :href="'/admin/products?page=' + (products.totalPages)">Cuối</a>
                </li>
            </ul>
        </nav>
    </template>
</div>
