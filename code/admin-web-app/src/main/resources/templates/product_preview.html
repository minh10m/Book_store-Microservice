<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <div th:x-data="|initData('${productCode}')|" class="pb-5 container">
        
        <!-- Loading State -->
        <div x-show="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <template x-if="!loading && product">
            <div class="row justify-content-center animate-fade-in" x-cloak>
                <div class="col-lg-10">
                    <div class="mb-4">
                        <a :href="'/products/' + productCode" class="btn btn-outline-secondary rounded-pill">
                            <i class="bi bi-arrow-left me-2"></i> Quay lại
                        </a>
                    </div>
                    
                    <div class="card p-4 p-md-5 glassmorphism-card shadow-lg border-0">
                        <div class="text-center mb-5 border-bottom border-secondary pb-4">
                            <h2 class="fw-bold text-primary mb-3"><i class="bi bi-book-half me-2"></i> Đọc thử trang đầu</h2>
                            <h4 class="text-white" x-text="product.name">Book Title</h4>
                        </div>
                        
                        <div class="preview-content text-secondary lh-lg" style="font-size: 1.2rem; white-space: pre-wrap; text-align: justify; font-family: 'Georgia', serif;" x-text="product.previewText">
                        </div>
                        
                        <div class="text-center mt-5 pt-4 border-top border-secondary">
                            <p class="text-white mb-4">Bạn có thấy nội dung này thú vị không?</p>
                            <a :href="'/products/' + productCode" class="btn btn-primary btn-lg px-5 py-3 rounded-pill fw-bold shadow-sm">
                                <i class="bi bi-bag-check me-2"></i> Xem chi tiết & Mua sách
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>
</div>

<style layout:fragment="pageStyles">
    .glassmorphism-card {
        background: rgba(30, 41, 59, 0.8) !important;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
    }
    [x-cloak] { display: none !important; }
    
    .preview-content {
        color: #e2e8f0 !important;
        line-height: 2 !important;
    }
</style>

<div layout:fragment="pageScripts">
    <script src="/js/productDetails.js"></script>
</div>
</body>
</html>
