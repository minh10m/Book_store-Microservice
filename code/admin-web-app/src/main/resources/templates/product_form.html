<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <div th:x-data="|initProductFormData('${productCode}')|" class="animate-fade-in pb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-light mb-0" x-text="isEditing ? 'Sửa Sách' : 'Thêm Sách Mới'"></h2>
            <a th:href="@{/products}" class="btn btn-outline-secondary fw-bold rounded-pill px-4">
                <i class="bi bi-arrow-left me-1"></i> Trở lại
            </a>
        </div>

        <div class="card border-0 shadow-lg" style="background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border-radius: 16px;">
            <div class="card-body p-4">
                <!-- Loading State -->
                <div x-show="loading" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="text-secondary mt-2">Đang tải dữ liệu...</p>
                </div>

                <form @submit.prevent="saveProduct" x-show="!loading">
                    <div class="row g-4">
                        <div class="col-md-8">
                            <label class="form-label text-secondary fw-medium fs-sm">Tên sách</label>
                            <input type="text" class="form-control bg-dark border-0 text-white shadow-none" x-model="product.name" required placeholder="Tên sách">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-secondary fw-medium fs-sm">Giá (USD)</label>
                            <input type="number" step="0.01" class="form-control bg-dark border-0 text-white shadow-none" x-model="product.price" required placeholder="0.00">
                        </div>
                        <div class="col-12">
                            <label class="form-label text-secondary fw-medium fs-sm">URL Hình ảnh</label>
                            <input type="url" class="form-control bg-dark border-0 text-white shadow-none" x-model="product.imageUrl" placeholder="https://...">
                        </div>
                        <div class="col-12">
                            <label class="form-label text-secondary fw-medium fs-sm">Tóm tắt ngắn</label>
                            <input type="text" class="form-control bg-dark border-0 text-white shadow-none" x-model="product.previewText" placeholder="Đoạn mô tả ngắn gọn...">
                        </div>
                        <div class="col-12">
                            <label class="form-label text-secondary fw-medium fs-sm">Mô tả chi tiết</label>
                            <textarea class="form-control bg-dark border-0 text-white shadow-none" rows="6" x-model="product.description" placeholder="Nhập mô tả sách..."></textarea>
                        </div>
                    </div>
                    
                    <div class="mt-4 pt-4 border-top border-secondary d-flex justify-content-end gap-3">
                        <a th:href="@{/products}" class="btn btn-outline-secondary fw-medium px-4 rounded-pill">Hủy</a>
                        <button type="submit" class="btn btn-primary fw-bold rounded-pill px-5 shadow-sm" x-text="isSaving ? 'Đang lưu...' : 'Lưu lại'" :disabled="isSaving"></button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="pageScripts">
    <script th:src="@{/js/admin_product_form.js}"></script>
</div>
</body>
</html>
