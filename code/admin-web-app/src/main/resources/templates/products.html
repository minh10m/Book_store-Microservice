<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <div th:x-data="|initAdminProductsData('${pageNo}')|" class="animate-fade-in pb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-light mb-0"><i class="bi bi-journal-album me-2"></i>Quản lý Sách</h2>
            <button class="btn btn-primary fw-bold rounded-pill px-4 shadow-sm" @click="openCreateModal()">
                <i class="bi bi-plus-lg me-1"></i> Thêm Sách Mới
            </button>
        </div>

        <div class="card border-0 shadow-lg" style="background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border-radius: 16px;">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-dark table-hover mb-0" style="background: transparent;">
                        <thead style="background: rgba(15, 23, 42, 0.8);">
                            <tr>
                                <th class="border-0 px-4 py-3 rounded-top-left text-secondary fw-semibold">Mã</th>
                                <th class="border-0 px-4 py-3 text-secondary fw-semibold">Hình ảnh</th>
                                <th class="border-0 px-4 py-3 text-secondary fw-semibold w-25">Tên sách</th>
                                <th class="border-0 px-4 py-3 text-secondary fw-semibold">Giá (USD)</th>
                                <th class="border-0 px-4 py-3 text-secondary fw-semibold rounded-top-right text-end">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Loading State -->
                            <tr x-show="loading">
                                <td colspan="5" class="text-center py-5 border-0">
                                    <div class="spinner-border text-primary" role="status"></div>
                                </td>
                            </tr>
                            
                            <!-- Empty State -->
                            <tr x-show="!loading && (!products || !products.data || products.data.length === 0)">
                                <td colspan="5" class="text-center py-5 border-0 text-secondary">
                                    <i class="bi bi-inbox fs-1 mb-2 d-block"></i>
                                    <p>Không có dữ liệu</p>
                                </td>
                            </tr>

                            <template x-for="product in products.data" :key="product.code">
                                <tr style="border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.3s;">
                                    <td class="px-4 py-3 align-middle text-secondary fw-medium" x-text="product.code"></td>
                                    <td class="px-4 py-3 align-middle">
                                        <img :src="product.imageUrl || '/images/default-book.png'" alt="book" style="width: 50px; height: 70px; object-fit: cover; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
                                    </td>
                                    <td class="px-4 py-3 align-middle fw-bold text-white" x-text="product.name"></td>
                                    <td class="px-4 py-3 align-middle text-info fw-semibold" x-text="new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(product.price)"></td>
                                    <td class="px-4 py-3 align-middle text-end">
                                        <button class="btn btn-sm btn-outline-info rounded-pill px-3 fw-medium border-0 me-2" style="background: rgba(13, 202, 240, 0.1);" @click="openEditModal(product)">
                                            <i class="bi bi-pencil-square"></i> Sửa
                                        </button>
                                        <button class="btn btn-sm btn-outline-danger rounded-pill px-3 fw-medium border-0" style="background: rgba(220, 53, 69, 0.1);" @click="deleteProduct(product.code)">
                                            <i class="bi bi-trash"></i> Xóa
                                        </button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div class="mt-4 d-flex justify-content-end" x-show="!loading && products && products.data && products.data.length > 0">
            <div th:replace="~{fragments/pagination :: pagination}"> </div>
        </div>

        <!-- Product Modal -->
        <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true" x-ref="productModal">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content border-0 shadow-lg" style="background: #1e293b; border-radius: 20px;">
                    <div class="modal-header border-0 pb-0 pt-4 px-4">
                        <h5 class="modal-title fw-bold text-white fs-4" x-text="isEditing ? 'Sửa Sách' : 'Thêm Sách Mới'"></h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <form @submit.prevent="saveProduct">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label text-secondary fw-medium fs-sm">Mã sách</label>
                                    <input type="text" class="form-control bg-dark border-0 text-white shadow-none" x-model="currentProduct.code" :disabled="isEditing" required placeholder="Ví dụ: P100">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-secondary fw-medium fs-sm">Tên sách</label>
                                    <input type="text" class="form-control bg-dark border-0 text-white shadow-none" x-model="currentProduct.name" required placeholder="Tên sách">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-secondary fw-medium fs-sm">Giá (USD)</label>
                                    <input type="number" step="0.01" class="form-control bg-dark border-0 text-white shadow-none" x-model="currentProduct.price" required placeholder="0.00">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-secondary fw-medium fs-sm">URL Hình ảnh</label>
                                    <input type="url" class="form-control bg-dark border-0 text-white shadow-none" x-model="currentProduct.imageUrl" placeholder="https://...">
                                </div>
                                <div class="col-12">
                                    <label class="form-label text-secondary fw-medium fs-sm">Tóm tắt ngắn</label>
                                    <input type="text" class="form-control bg-dark border-0 text-white shadow-none" x-model="currentProduct.previewText" placeholder="Đoạn mô tả ngắn gọn...">
                                </div>
                                <div class="col-12">
                                    <label class="form-label text-secondary fw-medium fs-sm">Mô tả chi tiết</label>
                                    <textarea class="form-control bg-dark border-0 text-white shadow-none" rows="4" x-model="currentProduct.description" placeholder="Nhập mô tả sách..."></textarea>
                                </div>
                            </div>
                            <div class="mt-4 pt-3 border-top border-secondary d-flex justify-content-end gap-2">
                                <button type="button" class="btn text-secondary fw-medium" data-bs-dismiss="modal">Hủy</button>
                                <button type="submit" class="btn btn-primary fw-bold rounded-pill px-4 shadow-sm" x-text="isSaving ? 'Đang lưu...' : 'Lưu lại'" :disabled="isSaving"></button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<style>
    .table-dark {
        --bs-table-bg: transparent;
        --bs-table-color: #f8fafc;
        --bs-table-hover-bg: rgba(255, 255, 255, 0.05);
        --bs-table-hover-color: #ffffff;
    }
    .rounded-top-left { border-top-left-radius: 12px; }
    .rounded-top-right { border-top-right-radius: 12px; }
</style>
<div layout:fragment="pageScripts">
    <script src="/js/admin_products.js"></script>
</div>
</body>
</html>
