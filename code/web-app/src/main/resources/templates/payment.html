<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Complete Your Payment</title>
    <style>
        .payment-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            max-width: 600px;
            margin: 40px auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .order-summary {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 20px;
            margin: 24px 0;
        }
        .paypal-btn {
            background: #ffc439;
            color: #003087;
            font-weight: 700;
            border-radius: 50px;
            padding: 16px 32px;
            width: 100%;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 1.1rem;
        }
        .paypal-btn:hover {
            background: #f2ba36;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 196, 57, 0.2);
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: rgba(255, 255, 255, 0.1);
        }
        .gradient-text {
            background: linear-gradient(135deg, #60a5fa 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="container py-5">
        <div class="payment-card text-center" x-data="paymentHandler()">
            <h1 class="mb-4 gradient-text display-5 fw-bold">Thanh toán an toàn</h1>
            <p class="text-secondary">Vui lòng hoàn tất thanh toán để hoàn tất đơn hàng của bạn.</p>

            <div class="order-summary text-start">
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-secondary">Mã đơn hàng:</span>
                    <span class="fw-bold" th:text="${order.orderNumber}">#ORD-123</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-secondary">Khách hàng:</span>
                    <span th:text="${order.customer.name}">John Doe</span>
                </div>
                <hr style="opacity: 0.1">
                <div class="d-flex justify-content-between align-items-center">
                    <span class="h5 mb-0">Tổng tiền</span>
                    <span class="h3 mb-0 gradient-text">
                        <span th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'POINT', 0, 'COMMA')}">0</span> VNĐ
                    </span>
                </div>
            </div>

            <div class="mt-5">
                <button @click="payWithPayPal()" 
                        class="paypal-btn" 
                        id="pay-button"
                        :disabled="loading">
                    <span x-show="!loading">Thanh toán với <b>PayPal</b></span>
                    <span x-show="loading" class="spinner-border spinner-border-sm"></span>
                </button>
            </div>

            <p class="mt-4 text-secondary small">
                <i class="bi bi-shield-lock me-1"></i> Giao dịch của bạn được mã hóa và bảo mật.
            </p>
            
            <div id="error-message" class="alert alert-danger mt-3" style="display: none"></div>
        </div>
    </div>

    <script th:inline="javascript">
        function paymentHandler() {
            return {
                loading: false,
                orderNumber: /*[[${order.orderNumber}]]*/ '',
                totalAmount: /*[[${order.totalAmount}]]*/ 0,
                customerName: /*[[${order.customer.name}]]*/ '',

                async payWithPayPal() {
                    this.loading = true;
                    try {
                        const response = await fetch('/api/payments/paypal/create', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                amount: this.totalAmount,
                                nameTransactor: this.customerName,
                                orderNumber: this.orderNumber
                            })
                        });

                        if (!response.ok) throw new Error('Payment creation failed');

                        const data = await response.json();
                        window.location.href = data.approvalUrl;
                    } catch (error) {
                        console.error(error);
                        const errEl = document.getElementById('error-message');
                        errEl.textContent = 'Đã có lỗi xảy ra. Vui lòng thử lại.';
                        errEl.style.display = 'block';
                        this.loading = false;
                    }
                }
            }
        }
    </script>
</div>
</body>
</html>
