<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Thanh toán thành công</title>
    <style>
        .success-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 60px 40px;
            max-width: 500px;
            margin: 80px auto;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .success-icon {
            font-size: 5rem;
            color: #10b981;
            margin-bottom: 24px;
            display: inline-block;
            animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes scaleIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
        .btn-home {
            background: linear-gradient(135deg, #60a5fa 0%, #a855f7 100%);
            border: none;
            border-radius: 4px;
            padding: 12px 32px;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            color: white;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="container">
        <div class="success-card">
            <div class="success-icon">
                <i class="bi bi-check-circle-fill"></i>
            </div>
            <h1 class="h2 fw-bold mb-3" style="background: linear-gradient(135deg, #60a5fa 0%, #a855f7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                Thanh toán thành công!
            </h1>
            <p class="text-secondary mb-5">
                Cảm ơn bạn đã mua sắm. Đơn hàng của bạn đang được xử lý và sẽ sớm được giao đến bạn.
            </p>
            <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">
                <a href="/orders" class="btn btn-home">Xem đơn hàng của tôi</a>
                <a href="/products" class="btn btn-outline-secondary px-4">Tiếp tục mua sắm</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
