<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <div th:x-data="|initData('${pageNo}')|" class="animate-fade-in">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h2 class="fw-bold mb-0">Khám phá sách mới</h2>
            <div th:replace="~{fragments/pagination :: pagination}"> </div>
        </div>

        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 g-4">
            <template x-for="product in products.data">
                <div class="col">
                    <div class="card h-100 border-0 shadow-sm overflow-hidden product-card">
                        <a :href="'/products/' + product.code" class="text-decoration-none text-light d-block">
                            <div class="position-relative overflow-hidden" style="height: 320px;">
                                <img :src="product.imageUrl"
                                     class="card-img-top w-100 h-100 object-fit-cover transition-transform"
                                     alt="Product Image"
                                     style="transition: transform 0.5s ease;"
                                     @mouseenter="$el.style.transform = 'scale(1.1)'"
                                     @mouseleave="$el.style.transform = 'scale(1)'"
                                />
                                <div class="position-absolute top-0 end-0 p-2">
                                    <span class="badge bg-primary shadow">NEW</span>
                                </div>
                            </div>
    
                            <div class="card-body p-3">
                                <h6 class="card-title fw-bold mb-2 text-truncate-2" 
                                    x-text="product.name" 
                                    :title="product.name">product.name</h6>
                            </div>
                        </a>
                        <div class="card-body px-3 py-0 mb-3">
                            <p class="h5 fw-bold text-primary mb-0"
                               x-text="new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(product.price)">product.price</p>
                        </div>
                        
                        <div class="card-footer bg-transparent border-0 p-3 pt-0">
                            <button class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2" 
                                    @click="addToCart(product)">
                                <i class="bi bi-cart-plus"></i>
                                <span>Thêm vào giỏ</span>
                            </button>
                        </div>
                    </div>
                </div>
            </template>
        </div>
        
        <div class="mt-5">
            <div th:replace="~{fragments/pagination :: pagination}"> </div>
        </div>
    </div>
</div>
<style>
    .text-truncate-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        height: 3rem;
    }
    .product-card {
        background: rgba(30, 41, 59, 0.4) !important;
    }
    .object-fit-cover {
        object-fit: cover;
    }
</style>
<div layout:fragment="pageScripts">
    <script src="/js/products.js"></script>
</div>
</body>
</html>
