<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <div th:x-data="|initData('${pageNo}')|" class="animate-fade-in">
        <div class="row">
            <!-- Sidebar Lọc -->
            <div class="col-lg-3 mb-4">
                <div class="card border-0 shadow" style="background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border-radius: 16px;">
                    <div class="card-body p-4">
                        <h5 class="card-title fw-bold mb-4 text-white"><i class="bi bi-funnel-fill text-primary me-2"></i>Bộ Lọc Tìm Kiếm</h5>
                        
                        <div class="mb-4">
                            <label class="form-label text-light fw-medium fs-sm mb-2">Từ khóa</label>
                            <div class="input-group">
                                <span class="input-group-text border-0 text-secondary" style="background: #0f172a;"><i class="bi bi-search"></i></span>
                                <input type="text" class="form-control border-0 custom-input" x-model="filters.keyword" placeholder="Tên sách, tác giả...">
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label text-light fw-medium fs-sm mb-2">Danh mục</label>
                            <div class="input-group">
                                <span class="input-group-text border-0 text-secondary" style="background: #0f172a;"><i class="bi bi-grid"></i></span>
                                <select class="form-select border-0 custom-input" x-model="filters.category">
                                    <option value="">Tất cả danh mục</option>
                                    <option value="IT">Công nghệ thông tin</option>
                                    <option value="Business">Kinh doanh</option>
                                    <option value="Fiction">Tiểu thuyết</option>
                                    <option value="Science">Khoa học</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="mb-5">
                            <label class="form-label text-light fw-medium fs-sm mb-2">Khoảng giá (USD)</label>
                            <div class="d-flex align-items-center gap-2">
                                <input type="number" class="form-control border-0 custom-input text-center" x-model="filters.minPrice" placeholder="Từ">
                                <span class="text-secondary fw-bold">-</span>
                                <input type="number" class="form-control border-0 custom-input text-center" x-model="filters.maxPrice" placeholder="Đến">
                            </div>
                        </div>
                        
                        <div class="d-flex flex-column gap-3">
                            <button class="btn btn-primary w-100 fw-bold py-2 shadow-sm rounded-pill" @click="applyFilters()">
                                Tìm kiếm
                            </button>
                            <button class="btn btn-link text-secondary text-decoration-none w-100" @click="resetFilters()">
                                <i class="bi bi-arrow-counterclockwise me-1"></i> Xóa bộ lọc
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Danh sách sản phẩm -->
            <div class="col-lg-9">
                <div class="mb-4">
                    <h2 class="fw-bold mb-0 text-light">Khám phá sách mới</h2>
                </div>

                <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
                    <!-- Trạng thái loading -->
                    <div x-show="loading" class="col-12 text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                    
                    <!-- Không tìm thấy -->
                    <div x-show="!loading && (!products || !products.data || products.data.length === 0)" class="col-12 text-center py-5 text-light">
                        <i class="bi bi-journal-x fs-1 mb-3 d-block text-secondary"></i>
                        <h5>Không tìm thấy sách phù hợp</h5>
                        <p class="text-secondary">Vui lòng thử lại với từ khóa hoặc bộ lọc khác.</p>
                    </div>

                    <template x-for="product in products.data" :key="product.code">
                        <div class="col">
                            <div class="card h-100 border-0 shadow-lg overflow-hidden product-card d-flex flex-column">
                                <a :href="'/products/' + product.code" class="text-decoration-none text-light d-flex flex-column flex-grow-1">
                                    <div class="position-relative overflow-hidden d-flex align-items-center justify-content-center" style="height: 320px; border-radius: 20px 20px 0 0; background: linear-gradient(to bottom, rgba(255,255,255,0.05), transparent);">
                                        <img :src="product.imageUrl || '/images/default-book.png'"
                                             class="w-100 h-100 transition-transform"
                                             alt="Product Image"
                                             style="object-fit: contain; padding: 1.5rem; transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));"
                                             @mouseenter="$el.style.transform = 'scale(1.08) translateY(-5px)'"
                                             @mouseleave="$el.style.transform = 'scale(1) translateY(0)'"
                                        />
                                        <div class="position-absolute top-0 end-0 p-3">
                                            <span class="badge rounded-pill shadow-lg px-3 py-2 fw-bold text-white" style="background: linear-gradient(45deg, #ff416c, #ff4b2b) !important; font-size: 0.75rem; letter-spacing: 1px;">NEW</span>
                                        </div>
                                    </div>
            
                                    <div class="card-body p-4 d-flex flex-column flex-grow-1 text-center">
                                        <h5 class="card-title fw-bold mb-3 text-truncate-2 text-white" 
                                            x-text="product.name" 
                                            style="font-size: 1.1rem; line-height: 1.4;"
                                            :title="product.name">product.name</h5>
                                    </div>
                                </a>
                                
                                <div class="card-footer bg-transparent border-0 p-4 pt-0 mt-auto text-center">
                                    <div class="mb-4">
                                        <span class="fs-3 fw-bold" style="color: #38bdf8;"
                                           x-text="new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(product.price)">product.price</span>
                                    </div>
                                    <button class="btn w-100 fw-bold py-3 rounded-pill d-flex align-items-center justify-content-center gap-2 text-white border-0" 
                                            style="background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%); box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3); transition: all 0.3s ease;"
                                            @click="addToCart(product)"
                                            onmouseover="this.style.transform='translateY(-2px) scale(1.02)'; this.style.boxShadow='0 8px 25px rgba(0, 114, 255, 0.5)';"
                                            onmouseout="this.style.transform='translateY(0) scale(1)'; this.style.boxShadow='0 4px 15px rgba(0, 114, 255, 0.3)';">
                                        <i class="bi bi-cart-plus-fill fs-5"></i>
                                        <span class="text-uppercase" style="letter-spacing: 1px;">Thêm vào giỏ</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
                
                <div class="mt-5" x-show="!loading && products && products.data && products.data.length > 0">
                    <div th:replace="~{fragments/pagination :: pagination}"> </div>
                </div>
            </div>
        </div>
    </div>
</div>
<style>
    .text-truncate-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        height: 3rem;
    }
    .text-truncate-3 {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .product-card {
        background-color: #1e293b !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        border-radius: 20px;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .product-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5) !important;
        border-color: rgba(56, 189, 248, 0.4) !important;
    }
    .object-fit-cover {
        object-fit: cover;
    }
    .btn-add-cart {
        background-color: #6366f1 !important;
        background-image: linear-gradient(135deg, #6366f1 0%, #a855f7 100%) !important;
        color: #ffffff !important;
        border: none !important;
        transition: all 0.3s ease;
    }
    .btn-add-cart:hover {
        background-color: #4f46e5 !important;
        background-image: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%) !important;
        color: #ffffff !important;
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 8px 20px rgba(168, 85, 247, 0.5) !important;
    }
    body .custom-input {
        background-color: rgba(255, 255, 255, 0.1) !important;
        color: #ffffff !important;
    }
    input.custom-input::-webkit-input-placeholder { color: #ffffff !important; opacity: 1 !important; }
    input.custom-input::-moz-placeholder { color: #ffffff !important; opacity: 1 !important; }
    input.custom-input:-ms-input-placeholder { color: #ffffff !important; opacity: 1 !important; }
    input.custom-input:-moz-placeholder { color: #ffffff !important; opacity: 1 !important; }
    input.custom-input::placeholder { color: #ffffff !important; opacity: 1 !important; }
    body select.custom-input {
        background-color: #1e293b !important;
        color: #ffffff !important;
    }
    body select.custom-input option {
        background-color: #1e293b !important;
        color: #ffffff !important;
    }
    body .custom-input:focus {
        background-color: rgba(255, 255, 255, 0.15) !important;
        color: #ffffff !important;
        box-shadow: 0 0 0 0.25rem rgba(255, 255, 255, 0.25) !important;
    }
</style>
<div layout:fragment="pageScripts">
    <script src="/js/products.js"></script>
</div>
</body>
</html>
