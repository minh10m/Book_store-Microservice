<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
  <div x-data="initData()">
    <div class="col-md-8 offset-md-2">

      <div x-show="cart.items.length == 0">
        <h3>Giỏ hàng trống. <a href="/">Tiếp tục mua sắm</a></h3>
      </div>
      <div x-show="cart.items.length > 0" class="pb-3">
        <table class="table">
          <thead>
          <tr>
            <th scope="col">Tên sản phẩm</th>
            <th scope="col">Giá</th>
            <th scope="col">Số lượng</th>
            <th scope="col">Thành tiền</th>
          </tr>
          </thead>
          <tbody>
          <template x-for="item in cart.items">
            <tr>
              <td x-text="item.name">name</td>
              <td x-text="new Intl.NumberFormat('vi-VN').format(item.price) + ' VNĐ'">price</td>
              <td>
                <input type="number" min="0" x-model="item.quantity"
                       @change="updateItemQuantity(item.code, $event.target.value)"/>
              </td>
              <td x-text="new Intl.NumberFormat('vi-VN').format(item.quantity * item.price) + ' VNĐ'">subTotal</td>
            </tr>
          </template>
          </tbody>
          <tfoot>
          <tr>
            <th colspan="3"></th>
            <th colspan="1" style="text-align: left">
              Tổng tiền: <span x-text="new Intl.NumberFormat('vi-VN').format(cart.totalAmount) + ' VNĐ'">cartTotal</span>
            </th>
          </tr>
          </tfoot>
        </table>

        <form class="row g-3" method="post" @submit.prevent="createOrder">
          <div class="col-md-6">
            <label for="customerName" class="form-label">Họ tên khách hàng</label>
            <input type="text" class="form-control"
                   id="customerName"
                   name="customerName"
                   x-model="orderForm.customer.name"
                   value=""/>
          </div>
          <div class="col-md-6">
            <label for="customerEmail" class="form-label">Email</label>
            <input type="email" class="form-control"
                   id="customerEmail"
                   name="customerEmail"
                   x-model="orderForm.customer.email"
                   value="">
          </div>
          <div class="col-md-6">
            <label for="customerPhone" class="form-label">Số điện thoại</label>
            <input type="text" class="form-control"
                   id="customerPhone"
                   name="customerPhone"
                   x-model="orderForm.customer.phone"
                   value="">
          </div>
          <div class="col-6">
            <label for="deliveryAddressLine1" class="form-label">Địa chỉ giao hàng 1</label>
            <input class="form-control"
                   id="deliveryAddressLine1"
                   name="deliveryAddressLine1"
                   x-model="orderForm.deliveryAddress.addressLine1"/>
          </div>
          <div class="col-6">
            <label for="deliveryAddressLine2" class="form-label">Địa chỉ giao hàng 2</label>
            <input class="form-control"
                   id="deliveryAddressLine2"
                   name="deliveryAddressLine2"
                   x-model="orderForm.deliveryAddress.addressLine2"/>
          </div>
          <div class="col-6">
            <label for="deliveryAddressCity" class="form-label">Thành phố</label>
            <input class="form-control"
                   id="deliveryAddressCity"
                   name="deliveryAddressCity"
                   x-model="orderForm.deliveryAddress.city"/>
          </div>
          <div class="col-6">
            <label for="deliveryAddressState" class="form-label">Tỉnh / Bang</label>
            <input class="form-control"
                   id="deliveryAddressState"
                   name="deliveryAddressState"
                   x-model="orderForm.deliveryAddress.state"/>
          </div>
          <div class="col-6">
            <label for="deliveryAddressZipCode" class="form-label">Mã Zip</label>
            <input class="form-control"
                   id="deliveryAddressZipCode"
                   name="deliveryAddressZipCode"
                   x-model="orderForm.deliveryAddress.zipCode"/>
          </div>
          <div class="col-6">
            <label for="deliveryAddressCountry" class="form-label">Quốc gia</label>
            <input class="form-control"
                   id="deliveryAddressCountry"
                   name="deliveryAddressCountry"
                   x-model="orderForm.deliveryAddress.country"/>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">Đặt hàng</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<div layout:fragment="pageScripts">
  <script src="/js/cart.js"></script>
</div>
</body>
</html>
