<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
  <div x-data="initData()" class="animate-fade-in">
    <h2 class="fw-bold mb-4">Giỏ hàng của bạn</h2>

    <div x-show="cart.items.length == 0" class="card p-5 text-center">
        <div class="mb-4">
            <i class="bi bi-cart-x text-secondary" style="font-size: 4rem;"></i>
        </div>
        <h3 class="fw-bold">Giỏ hàng đang trống</h3>
        <p class="text-secondary mb-4">Có vẻ như bạn chưa chọn sản phẩm nào.</p>
        <a href="/products" class="btn btn-primary px-4 py-2 mx-auto" style="width: fit-content;">Tiếp tục mua sắm</a>
    </div>

    <div x-show="cart.items.length > 0">
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card p-4">
                    <h5 class="fw-bold mb-4"><i class="bi bi-bag-check me-2"></i> Sản phẩm trong giỏ</h5>
                    <div class="table-responsive">
                        <table class="table">
                          <thead>
                          <tr>
                            <th scope="col">Sản phẩm</th>
                            <th scope="col" class="text-end">Giá</th>
                            <th scope="col" class="text-center">Số lượng</th>
                            <th scope="col" class="text-end">Thành tiền</th>
                          </tr>
                          </thead>
                          <tbody>
                          <template x-for="item in cart.items">
                            <tr>
                              <td class="fw-medium" x-text="item.name">name</td>
                              <td class="text-end" x-text="new Intl.NumberFormat('vi-VN').format(item.price) + ' đ'">price</td>
                              <td style="width: 120px;">
                                <div class="input-group input-group-sm">
                                    <button class="btn btn-outline-secondary" @click="updateItemQuantity(item.code, parseInt(item.quantity)-1)">-</button>
                                    <input type="number" class="form-control text-center bg-transparent" min="0" x-model="item.quantity"
                                           @change="updateItemQuantity(item.code, $event.target.value)"/>
                                    <button class="btn btn-outline-secondary" @click="updateItemQuantity(item.code, parseInt(item.quantity)+1)">+</button>
                                </div>
                              </td>
                              <td class="text-end fw-bold" x-text="new Intl.NumberFormat('vi-VN').format(item.quantity * item.price) + ' đ'">subTotal</td>
                            </tr>
                          </template>
                          </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card p-4 mb-4">
                    <h5 class="fw-bold mb-4"><i class="bi bi-receipt me-2"></i> Tổng cộng</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-secondary">Tạm tính:</span>
                        <span class="fw-medium" x-text="new Intl.NumberFormat('vi-VN').format(cart.totalAmount) + ' đ'">0 đ</span>
                    </div>
                    <div class="d-flex justify-content-between mb-4">
                        <span class="text-secondary">Phí vận chuyển:</span>
                        <span class="text-success fw-medium">Miễn phí</span>
                    </div>
                    <hr class="mb-4">
                    <div class="d-flex justify-content-between mb-4">
                        <span class="h5 fw-bold">Tổng cộng:</span>
                        <span class="h4 fw-bold text-primary" x-text="new Intl.NumberFormat('vi-VN').format(cart.totalAmount) + ' đ'">0 đ</span>
                    </div>
                </div>

                <div class="card p-4">
                    <h5 class="fw-bold mb-4"><i class="bi bi-truck me-2"></i> Thông tin giao hàng</h5>
                    <form class="row g-3" @submit.prevent="createOrder">
                      <div class="col-12">
                        <label class="small text-secondary mb-1">Họ tên</label>
                        <input type="text" class="form-control" x-model="orderForm.customer.name" required>
                      </div>
                      <div class="col-12">
                        <label class="small text-secondary mb-1">Email</label>
                        <input type="email" class="form-control" x-model="orderForm.customer.email" required>
                      </div>
                      <div class="col-12">
                        <label class="small text-secondary mb-1">Địa chỉ</label>
                        <input class="form-control mb-2" placeholder="Địa chỉ dòng 1" x-model="orderForm.deliveryAddress.addressLine1" required>
                        <input class="form-control" placeholder="Địa chỉ dòng 2 (không bắt buộc)" x-model="orderForm.deliveryAddress.addressLine2">
                      </div>
                      <div class="col-6">
                        <label class="small text-secondary mb-1">Thành phố</label>
                        <input class="form-control" x-model="orderForm.deliveryAddress.city" required>
                      </div>
                      <div class="col-6">
                        <label class="small text-secondary mb-1">Quốc gia</label>
                        <input class="form-control" x-model="orderForm.deliveryAddress.country" required>
                      </div>
                      <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold">
                            XÁC NHẬN ĐẶT HÀNG
                        </button>
                      </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
  </div>
</div>
<div layout:fragment="pageScripts">
  <script src="/js/cart.js"></script>
</div>
</body>
</html>
