spring.application.name=api-gateway
server.port=8989
server.shutdown=graceful
spring.mvc.problemdetails.enabled=true

######## API Gateway Application Configuration  #########
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.globalcors.cors-configurations["[/**]"].allowed-origins="*"
spring.cloud.gateway.globalcors.cors-configurations["[/**]"].allowed-methods="*"
spring.cloud.gateway.globalcors.cors-configurations["[/**]"].allowed-headers="*"
spring.cloud.gateway.globalcors.cors-configurations["[/**]"].allow-credentials=true

spring.cloud.gateway.routes[0].id=catalog-service
spring.cloud.gateway.routes[0].uri=${CATALOG_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/catalog/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/catalog/?(?<segment>.*), /${segment}

spring.cloud.gateway.routes[1].id=orders-service
spring.cloud.gateway.routes[1].uri=${ORDER_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/orders/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/orders/?(?<segment>.*), /${segment}

spring.cloud.gateway.routes[3].id=openapi
spring.cloud.gateway.routes[3].uri=http://localhost:${server.port}
spring.cloud.gateway.routes[3].predicates[0]=Path=/v3/api-docs/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/v3/api-docs/?(?<segment>.*), /${segment}/v3/api-docs

spring.cloud.gateway.routes[2].id=payment-service
spring.cloud.gateway.routes[2].uri=${PAYMENT_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.routes[2].predicates[0]=Path=/payments/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/payments/?(?<segment>.*), /${segment}

######## Actuator Configuration  #########
management.info.git.mode=full
management.endpoints.web.exposure.include=*
management.metrics.tags.application=${spring.application.name}
management.tracing.enabled=false
management.tracing.sampling.probability=1.0

######## Swagger Configuration  #########
springdoc.swagger-ui.use-root-path=true
#springdoc.swagger-ui.urls[0].name=catalog
#springdoc.swagger-ui.urls[0].url=/v3/api-docs/catalog
#springdoc.swagger-ui.urls[1].name=orders
#springdoc.swagger-ui.urls[1].url=/v3/api-docs/orders

spring.cloud.gateway.routes[4].id=search-service
spring.cloud.gateway.routes[4].uri=${SEARCH_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.routes[4].predicates[0]=Path=/search/**
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/search/?(?<segment>.*), /${segment}

spring.cloud.gateway.routes[5].id=admin-web-app
spring.cloud.gateway.routes[5].uri=${ADMIN_WEB_APP_URL:http://localhost:8086}
spring.cloud.gateway.routes[5].predicates[0]=Path=/admin/**
spring.cloud.gateway.routes[5].filters[0]=PreserveHostHeader
