name: 'bookstore-microservice-app'
services:
  catalog-service:
    image: minh1010/bookstore-catalog-service
    container_name: catalog-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SWAGGER_API_GATEWAY_URL=http://api-gateway:8989/catalog
    env_file:
      - ./docker-compose.env
    networks:
      - bookstore-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 700m

  order-service:
    image: minh1010/bookstore-order-service
    container_name: order-service
    env_file:
      - ./docker-compose.env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SWAGGER_API_GATEWAY_URL=http://api-gateway:8989/orders
    ports:
      - "8082:8082"
    networks:
      - bookstore-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024m

  payment-service:
    image: minh1010/bookstore-payment-service
    container_name: payment-service
    env_file:
      - ./docker-compose.env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SWAGGER_API_GATEWAY_URL=http://api-gateway:8989/payments
    ports:
      - "8084:8084"
    networks:
      - bookstore-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 700m

  notification-service:
    image: minh1010/bookstore-notification-service
    container_name: notification-service
    env_file:
      - ./docker-compose.env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8083:8083"
    networks:
      - bookstore-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 700m

  api-gateway:
    image: minh1010/bookstore-api-gateway
    container_name: api-gateway
    env_file:
      - ./docker-compose.env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8989:8989"
    networks:
      - bookstore-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 700m

  web-app:
    image: minh1010/bookstore-web-app
    container_name: web-app
    env_file:
      - ./docker-compose.env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8080:8080"
    networks:
      - bookstore-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 700m

networks:
  bookstore-network:
    external: true
